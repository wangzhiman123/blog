# 友情链接数据
#
# 字段说明：
#   nickname     必填，站点名称
#   url          必填，站点地址
#   description  一句话简介，鼠标悬停提示，也会被搜索框检索
#   avatar       头像地址。**直接写对方的图片链接即可，不要把图片存进仓库**；
#                留空则显示默认的灰色头像（对方换头像、防盗链都不会影响站点）
#   avatar_fit   头像填充方式：cover（默认，裁切填满）/ contain（完整显示，适合横向长条 logo）
#   group        分组，取值见 content/friends/index.md 里的 friend_groups
#   weight       排序权重，越大越靠前（只在同一分组内比较）
#
# 新增一条：复制下面任意一组，改内容即可，不用动模板。

