# 分类层级：一级分类 + 其下的二级分类（可选配置文件）
#
# 文章的 front matter 里写两个名字（一级在前、二级在后），例如：
#   categories:
#   - 工作
#   - 案例复盘
#
# 【自动同步】网站会从所有文章里自动收集分类：新的一级分类会自动出现在顶部菜单
# 和分类总览页，新的二级分类会自动挂到对应大类下，不用改本文件。
#
# 本文件现在只负责三件可选的事：
#   1. icon   —— 一级分类前面的图标（没写则用 fa-solid fa-folder）
#   2. desc   —— 分类页的一段说明、菜单悬停提示
#   3. 顺序   —— 一级 / 二级分类的排列先后；没写进来的分类自动排在末尾
# 所以「新增分类」不用动这里；只有想指定图标、说明或排序时，才按下面的格式补一段。

- name: 工作
  icon: fa-solid fa-briefcase
  desc: 办案、检索、文书与执业中的实务记录
  children:
    - 非诉实务
    - 案例复盘
    - 诉讼实务
    - 文书模板
    - 办案工具
    - 法律科普
    - 执业成长

- name: 学习
  icon: fa-solid fa-graduation-cap
  desc: 建站、工具与读书思考
  children:
    - 建站笔记
    - 工具教程
    - 思考随记

- name: 生活
  icon: fa-solid fa-mug-hot
  desc: 日常、办事与家人
  children:
    - 日常随笔
    - 办事指南
    - 爱妻日常

- name: 其他
  icon: fa-solid fa-box-archive
  desc: 其他的都在这里
  children: []