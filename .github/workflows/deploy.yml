name: Hugo build and deploy

# =====================================================================================
# 版本锁（想长期稳定运行，就别让这些数字漂移）
#
#   Hugo         0.169.0     ← 本文件 vars.HUGO_VERSION || 默认值
#   Dart Sass    1.107.1     ← 本文件 npm 安装行
#   主题 FixIt   22d86c1      ← git 子模块指针（themes/FixIt）
#   Twikoo 客户端 随主题打包    ← themes/FixIt/assets/lib/twikoo
#   Mermaid      12.2.0      ← config/_default/params.toml [mermaid] cdn
#   MathJax      3.2.2       ← config/_default/params.toml [math.mathjax] cdn
#
# 为什么要锁：
#   Hugo 曾经在 0.146 移除内置 RSS 模板的调用方式，本站在 0.169 上重写过一份
#   RSS 模板才恢复正常；主题也在自动更新时把中文配置覆盖过。任何一处「自动跟
#   最新」，都可能让构建在某天无声失败或把页面改坏。
#
# 怎么升级（一次只动一处，改完看一眼网站）：
#   1. 只改下面一行版本号，提交，等 Actions 跑完
#   2. 构建红了就看日志，回滚这次提交即可（线上仍是上一次成功的版本）
#   3. Hugo 升级前先读 https://github.com/gohugoio/hugo/releases 的 Breaking changes
#
# 想临时用别的 Hugo 版本、又不想改代码：仓库 Settings → Secrets and variables →
# Actions → Variables 里加一个 HUGO_VERSION，它的优先级高于下面的默认值。
# =====================================================================================
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'config/**'
      - 'content/**'
      - 'data/**'
      # 站点自己写的 partial / shortcode / 布局覆盖都在这里，漏了会导致改了模板却不重新构建
      - 'layouts/**'
      - 'i18n/**'
      - 'static/**'
      - 'themes/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Update theme']
    types:
      - completed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 固定版本，不再用 latest：Hugo 的小版本也会带破坏性变更（0.146 改过 RSS 模板）
          # 想临时换版本就在仓库 Variables 里加 HUGO_VERSION，优先于这里的默认值
          hugo-version: ${{ vars.HUGO_VERSION || '0.169.0' }}
          extended: true
      # 主题的 SCSS 走 dartsass 转译，Hugo 会去 PATH 里找 sass 可执行文件。
      # 以前用社区 action（内部装 latest），现在自己装固定版本，升级时机由我们决定。
      - name: Setup Node (for Dart Sass)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Dart Sass 1.107.1
        run: npm install --global sass@1.107.1 && sass --version
      - name: Hugo build
        run: hugo --gc --minify --logLevel info
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the public directory
          path: './public'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
