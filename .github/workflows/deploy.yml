name: Hugo build and deploy

# =====================================================================================
# 版本锁（想长期稳定运行，就别让这些数字漂移）
#
#   Hugo         0.169.0     ← 本文件 vars.HUGO_VERSION || 默认值
#   Dart Sass    action v1.0.1（其内部装最新 dart-sass，半浮动）
#   主题 FixIt   22d86c1      ← git 子模块指针（themes/FixIt）
#   Twikoo 客户端 随主题打包    ← themes/FixIt/assets/lib/twikoo
#   Mermaid      12.2.0      ← config/_default/params.toml [mermaid] cdn
#   MathJax      3.2.2       ← config/_default/params.toml [math.mathjax] cdn
#
# 为什么要锁：
#   Hugo 曾经在 0.146 移除内置 RSS 模板的调用方式，本站在 0.169 上重写过一份
#   RSS 模板才恢复正常；主题也在自动更新时把中文配置覆盖过。任何一处「自动跟
#   最新」，都可能让构建在某天无声失败或把页面改坏。
#
# 怎么升级（一次只动一处，改完看一眼网站）：
#   1. 只改下面一行版本号，提交，等 Actions 跑完
#   2. 构建红了就看日志，回滚这次提交即可（线上仍是上一次成功的版本）
#   3. Hugo 升级前先读 https://github.com/gohugoio/hugo/releases 的 Breaking changes
#
# 想临时用别的 Hugo 版本、又不想改代码：仓库 Settings → Secrets and variables →
# Actions → Variables 里加一个 HUGO_VERSION，它的优先级高于下面的默认值。
# =====================================================================================
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'config/**'
      - 'content/**'
      - 'data/**'
      # 站点自己写的 partial / shortcode / 布局覆盖都在这里，漏了会导致改了模板却不重新构建
      - 'layouts/**'
      - 'i18n/**'
      - 'static/**'
      - 'themes/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Update theme']
    types:
      - completed
  workflow_dispatch:
    inputs:
      push_all:
        description: '把全部文章推给搜索引擎（首次收录时勾一次即可）'
        type: boolean
        default: false
  schedule:
    # 每天 04:10（北京时间）重建一次。
    # 首页「热门文章」的阅读量是构建时抓下来的快照，不重建就一直是旧的；
    # 定时重建能让榜单在你不发文的日子也跟着更新。
    - cron: '10 20 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 固定版本，不再用 latest：Hugo 的小版本也会带破坏性变更（0.146 改过 RSS 模板）
          # 想临时换版本就在仓库 Variables 里加 HUGO_VERSION，优先于这里的默认值
          hugo-version: ${{ vars.HUGO_VERSION || '0.169.0' }}
          extended: true
      # 主题的 SCSS 走 dartsass 转译，Hugo 会去 PATH 里找 sass 可执行文件。
      # 用固定的版本标签（v1.0.1），不要用 v1 这种浮动主标签：主标签会指到新代码上。
      # 注意：这个 action 内部装的是当时最新的 dart-sass，所以 dart-sass 本身
      # 仍是半浮动状态。要彻底钉死，需改成手工下载指定版本的 dart-sass；
      # 但 2026-11-01 试过 npm 全局安装 sass@1.107.1，Hugo 构建会失败，先保持现状。
      - name: Setup Dart Sass
        uses: dw-labs-org/dart-sass-gha@v1.0.1
      # 首页「热门文章」要先有阅读量数据：逐篇查 vercount 的只读接口（约 25 秒）。
      # 故意不设 continue-on-error: false —— 接口偶尔抽风是常事，不能让它把整站发布卡死。
      # 脚本失败时不写 data/pv.json，页面上的榜单自动隐藏（宁可不显示，也不显示全 0）。
      - name: Fetch page views for popular posts
        continue-on-error: true
        run: python3 tools/fetch-pv.py
      - name: Hugo build
        run: hugo --gc --minify --logLevel info
      # 生成 Pagefind 静态搜索索引（搜索框提速）。
      # 用固定版本 1.4.0，避免浮动 latest 在将来引入破坏性变更。
      # npx pagefind 默认下载 extended 版，对中文分词更友好，正适合本站。
      # 索引会写进 public/pagefind/，随站点一起被下面这步上传部署。
      - name: Build Pagefind search index
        run: npx -y pagefind@1.4.0 --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the public directory
          path: './public'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 部署成功后把文章推给搜索引擎。
  # 单独拆成一个 job 而不是塞进 deploy：推送失败不该让站点发布失败，
  # 所以这里也加了 continue-on-error，站点已经上线才是最重要的。
  submit:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    # 每天 04:10 的定时重建也走这个流程，但那种重建不会产生新文章，
    # 天天把同一批 URL 重推一遍没必要，还有被判定刷推送的风险。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Push new URLs to Baidu and IndexNow
        env:
          # 百度主动推送 token：仓库 Settings → Secrets and variables → Actions
          # 新建 BAIDU_TOKEN。没配就只推 IndexNow，脚本会自动跳过百度。
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          # 手动触发时勾了「推送全部文章」，就忽略 7 天时间窗口
          PUSH_ALL: "${{ inputs.push_all && '1' || '' }}"
        run: python3 tools/submit-urls.py
