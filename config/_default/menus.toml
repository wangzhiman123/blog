# -------------------------------------------------------------------------------------
# 菜单配置（简体中文，默认语言）
# See: https://fixit.lruihao.cn/docs/getting-started/configuration/#menu-configuration
#
# 结构：
#   博客 ▾（悬停自动展开）→ 文章 / 分类 / 标签
#   友链
# 子菜单用 parent 字段挂到父级 identifier，最多两层。
# 想在手机上也能看到某条目，就不要写 type = "desktop"。
# -------------------------------------------------------------------------------------

# ============ 博客（父级，鼠标移上去自动展开） ============
[[main]]
identifier = "blog"
parent = ""
pre = ""
post = ""
name = "博客"
url = "archives/"
title = "全部文章、分类与标签"
weight = 1

[main.params]
class = ""
draft = false
icon = "fa-solid fa-blog"
type = ""
divided = false

