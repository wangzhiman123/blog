# -------------------------------------------------------------------------------------
# 菜单配置（简体中文，默认语言）
# See: https://fixit.lruihao.cn/docs/getting-started/configuration/#menu-configuration
#
# 结构：
#   归档
#   分类 ▾（鼠标移上去自动展开）→ 自动读 data/categories.yml 的一级分类
#   标签
#   友链
#   关于
#
# 「分类」下拉的子项不在本文件里写死，而由
# layouts/_partials/custom/category-menu-items.html 直接读
# data/categories.yml 生成（名称、图标、说明、顺序都取自那里），
# 文章数由 layouts/_partials/custom/menu-count.html 自动统计。
# 因此增删一级分类只需改 data/categories.yml 一个文件；
# 本文件只保留「分类」这个父项，且 identifier 必须保持 "categories"。
# -------------------------------------------------------------------------------------

# ============ 首页 ============
