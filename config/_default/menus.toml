# -------------------------------------------------------------------------------------
# 菜单配置（简体中文，默认语言）
# See: https://fixit.lruihao.cn/docs/getting-started/configuration/#menu-configuration
#
# 结构：
#   归档
#   分类 ▾（鼠标移上去自动展开）→ 工作 / 学习 / 生活
#   标签
#   友链
#   关于
#
# 「分类」下拉里的三项就是 data/categories.yml 里的一级分类，
# 增删一级分类时，这里要同步改三处：identifier、name、pageRef。
# -------------------------------------------------------------------------------------

# ============ 归档 ============
[[main]]
identifier = "archives"
parent = ""
pre = ""
post = ""
name = "归档"
url = "archives/"
title = "按时间浏览全部文章"
weight = 1

[main.params]
class = ""
draft = false
icon = "fa-solid fa-archive"
type = ""
divided = false

# ============ 分类（父级，鼠标移上去自动展开三个一级分类） ============
