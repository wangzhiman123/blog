# -------------------------------------------------------------------------------------
# 语言配置
#
# 本站只做中文，单语言站。
#   zh-cn：默认语言，占用根路径 /
#
# 之前配过英文站（/en/），现已整体移除，相关文件也一并删除：
#   content/en/、各文章目录下的 index.en.md、menus.en.toml、data/friends.en.yml
#
# 如果哪天想重新开英文站：在下面重新加一个 [en] 块，并给文章补 index.en.md，
# 页面右上角的语言切换会自动出现（模板按 hugo.IsMultilingual 判断）。
# -------------------------------------------------------------------------------------

[zh-cn]
locale = "zh-CN"
label = "简体中文"
weight = 1
title = "王志满律师"
contentDir = "content"
hasCJKLanguage = true
