# -------------------------------------------------------------------------------------
# Output Configuration
# See: https://gohugo.io/configuration/outputs/
# -------------------------------------------------------------------------------------

# options to make hugo output files, the available values are below:
# home = ["html", "rss", "archives", "search", "offline", "manifest", "link", "readme", "baidu_urls"]
# page = ["html", "markdown"]
# section = ["html", "rss"]
# taxonomy = ["html"]
# term = ["html", "rss"]
#
# 自定义输出格式 LegacyFeed/LegacyRSS/LegacyAtom 定义在 hugo.toml 里
# （outputFormats 不能写在本文件，否则会被当成一种 output kind 报错）。

_merge = "shallow"
home = [
  "html",
  "rss",
  "archives",
  "search",
  "offline",
  "manifest",
  "link",
  "LegacyFeed",
  "LegacyRSS",
  "LegacyAtom"
]
page = [
  "html",
  "markdown"
]
section = [
  "html",
  "rss"
]
taxonomy = [ "html" ]
term = [
  "html",
  "rss"
]
