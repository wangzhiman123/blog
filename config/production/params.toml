# -------------------------------------------------------------------------------------
# 生产环境参数（hugo / CI 构建时生效，覆盖 config/_default/params.toml）
# 来自 hugo-fixit-starter1 实测修订版
# -------------------------------------------------------------------------------------

description = "民事诉讼与行政诉讼实务笔记"
keywords = ["律师", "民事诉讼", "上诉", "司法案例"]

[author]
# 必须与文章 front matter 里的 authors 值一字不差，否则 /authors/ 会分裂成两个归档
name = "王志满律师"
email = ""
link = ""
avatar = ""

[app]
title = "王志满律师"

[header]

[header.title]
# 模板默认值形如 "/<仓库名>/images/fixit.min.svg"，硬编码了仓库名，fork 后必然 404
logo = ""

[home]

[home.profile]
enable = true

# 放开 AI 爬虫（2026-11-01 起）。
#
# 配合仓库根目录的 layouts/robots.txt 一起生效：
#   - robots.txt 的实际内容由 layouts/robots.txt 决定（站点级覆盖了主题模板）；
#   - 这个开关控制的是文章页里那段只有 AI 爬虫能看到的提示，
#     它告诉 AI「本文的 Markdown 纯净版在哪个地址」，方便直接读取正文。
#
# 想改回屏蔽 AI 爬虫（例如不想被任何 AI 读取）：
#   把下面改成 allow_crawlers = false，同时删掉 layouts/robots.txt。
[robots]
allow_crawlers = true

